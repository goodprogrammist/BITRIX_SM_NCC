name: Release

# Push a tag equal to the manifest version, e.g.: git tag v1.1 && git push origin v1.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "manifest version: $VERSION, tag: $GITHUB_REF_NAME"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - name: Create GitHub release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --title "$GITHUB_REF_NAME" --generate-notes
